<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Best60VoltEbike.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <h1 class="text-xl font-black text-cyan-400 mb-2">Restricted Admin Access</h1>
        <p class="text-xs text-slate-400 mb-6">Enter master passcode or authenticate via host IP.</p>
        
        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-lg mb-4">{{ error }}</div>
        {% endif %}
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Master Passcode</label>
                <input type="password" name="passcode" required class="w-full bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg transition">Authenticate Admin</button>
        </form>
        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-cyan-400 transition">← Return to Public Matrix</a>
        </div>
    </div>
</body>
</html>
