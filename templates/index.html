<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Best 60V+ E-Bike & E-Moto Comparison Matrix</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { color: #38bdf8; font-size: 1.8rem; }
        p { color: #94a3b8; }
        .bike-card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .bike-card h3 { margin-top: 0; color: #f8fafc; }
        .admin-link { margin-top: 40px; display: inline-block; color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .admin-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Most Powerful E-Bikes and E-Motos Over 60 Volts</h1>
        <p>Best 60 Volt E-Bike : The Ultimate High-Voltage Performance Matrix</p>
        
        <div class="bike-list" style="margin-top: 30px;">
            {% for bike in bikes %}
            <div class="bike-card">
                <h3>{{ bike.name }}</h3>
                <p><strong>Voltage:</strong> {{ bike.voltage }} | <strong>Power:</strong> {{ bike.power }} | <strong>Speed:</strong> {{ bike.speed }} | <strong>Price:</strong> {{ bike.price }}</p>
            </div>
            {% endfor %}
        </div>
        
        <a href="/admin/login" class="admin-link">🔒 Admin Portal</a>
    </div>
</body>
</html>
