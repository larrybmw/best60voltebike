<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Admin Inbox & Matrix Manager</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { color: #38bdf8; }
        .form-box { background: #1e293b; padding: 25px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #334155; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0ea5e9; }
        .bike-card { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
        .logout { float: right; color: #f87171; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/logout" class="logout">Log Out</a>
        <h1>Secure Admin Inbox & Matrix Manager</h1>
        <p>Private backend submission tool. Only visible after authentication.</p>
        
        <div class="form-box">
            <h3>Quick-Add Machine to Matrix</h3>
            <form method="POST">
                <label>Model Name</label>
                <input type="text" name="name" placeholder="e.g., Wired Predator 72V" required>
                
                <label>Voltage (e.g. 72V)</label>
                <input type="text" name="voltage" placeholder="72V" required>
                
                <label>Peak Watts</label>
                <input type="text" name="power" placeholder="8,000W Peak" required>
                
                <label>Top Speed</label>
                <input type="text" name="speed" placeholder="55+ mph" required>
                
                <label>Price ($)</label>
                <input type="text" name="price" placeholder="$3,699" required>
                
                <button type="submit">Inject Machine Into Live Matrix</button>
            </form>
        </div>

        <h3>Active Matrix Database</h3>
        {% for bike in bikes %}
        <div class="bike-card">
            <strong>{{ bike.name }}</strong> — {{ bike.voltage }} | {{ bike.power }} | {{ bike.speed }} | {{ bike.price }}
        </div>
        {% endfor %}
    </div>
</body>
</html>
